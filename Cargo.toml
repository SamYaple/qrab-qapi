[workspace]
resolver = "3"
members = [
    "projects/qapi-codegen",
    "projects/qapi-macros",
    "projects/qapi",
    "projects/qapi-protocol",
]
# Schema generation is an explicit package selection.
default-members = [
    "projects/qapi-macros",
    "projects/qapi",
    "projects/qapi-protocol",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proc-macro2 = "1"
quote = "1"
syn = { version = "3.0.10", features = ["full"] }
tempfile = "3"
# The QAPI crates: the qrab-qapi* packages, under the names the code uses.
qapi = { package = "qrab-qapi", path = "projects/qapi", version = "0.1.0" }
qapi-codegen = { package = "qrab-qapi-codegen", path = "projects/qapi-codegen", version = "0.1.0" }
qapi-macros = { package = "qrab-qapi-macros", path = "projects/qapi-macros", version = "0.1.0" }

# Optimize the generator when the qrab-qapi `schema-docs` feature runs it from build.rs.
[profile.dev.package.qrab-qapi-codegen]
opt-level = 3
