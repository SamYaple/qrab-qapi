[workspace]
resolver = "3"
members = [
    "projects/qapi-codegen",
    "projects/qapi-macros",
    "projects/qapi",
    "projects/qapi-protocol",
]
# Schema generation is an explicit package selection.
default-members = [
    "projects/qapi-macros",
    "projects/qapi",
    "projects/qapi-protocol",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2"
proc-macro2 = "1"
quote = "1"
syn = { version = "3.0.10", features = ["full"] }
tempfile = "3"
