[package]
name = "qrab-qapi-protocol"
version = "0.1.0"
description = "Async QEMU QMP and guest agent (QGA) clients and mock servers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/qrab-dev/qrab-qapi"
homepage = "https://qrab.dev"
documentation = "https://docs.rs/qrab-qapi-protocol"
readme = "README.md"
keywords = ["qemu", "qmp", "qga", "async", "virtualization"]
categories = ["api-bindings", "asynchronous", "virtualization"]
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE", "/NOTICE"]

[package.metadata.docs.rs]
features = ["mock"]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "qapi_protocol"

[features]
# The mock sessions of the server module, for tests.
mock = []

[dependencies]
getrandom = "0.4"
nix = { workspace = true, features = ["socket", "uio"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
qapi = { workspace = true }

[dependencies.tokio]
workspace = true
features = ["net", "io-util", "sync", "rt", "macros", "time"]

[dev-dependencies]
# The crate's own tests use the mock sessions.
qrab-qapi-protocol = { path = ".", features = ["mock"] }
tempfile = { workspace = true }

[dev-dependencies.tokio]
workspace = true
features = ["net", "io-util", "sync", "rt", "macros", "rt-multi-thread", "process", "time", "test-util"]
