[package]
name = "qrab-qapi-protocol"
version = "0.2.0"
description = "Async QEMU QMP and guest agent (QGA) clients and mock servers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/qrab-dev/qrab-qapi"
homepage = "https://qrab.dev"
documentation = "https://docs.rs/qrab-qapi-protocol"
readme = "README.md"
keywords = ["qemu", "qmp", "qga", "async", "virtualization"]
categories = ["api-bindings", "asynchronous", "virtualization"]
include = ["/src/**", "/tests/**", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[package.metadata.docs.rs]
features = ["mock"]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "qapi_protocol"

[features]
default = ["tokio"]
# The QMP and guest agent clients, which run on Tokio.
tokio = ["dep:tokio", "dep:getrandom", "dep:rustix"]
# The mock sessions of the server module, for tests.
mock = ["tokio"]

[dependencies]
getrandom = { version = "0.4", optional = true }
# sendmsg with SCM_RIGHTS, for the descriptors of a QMP command.
rustix = { workspace = true, features = ["net"], optional = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
qapi-core = { workspace = true }

[dependencies.tokio]
workspace = true
optional = true
features = ["net", "io-util", "sync", "rt", "macros", "time"]

[dev-dependencies]
# The crate's own tests use the mock sessions.
qrab-qapi-protocol = { path = ".", features = ["mock"] }
# The generated types of the tests and the documentation's examples.
qapi = { workspace = true }
tempfile = { workspace = true }
# The tests receive the descriptors that the client sends.
rustix = { workspace = true, features = ["net", "pipe"] }

[dev-dependencies.tokio]
workspace = true
features = ["net", "io-util", "sync", "rt", "macros", "rt-multi-thread", "process", "time", "test-util"]
