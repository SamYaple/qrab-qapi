[package]
name = "qrab-qapi-macros"
version = "0.1.0"
description = "Attribute macro for the generated QEMU QAPI types of qrab-qapi"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/qrab-dev/qrab-qapi"
homepage = "https://qrab.dev"
documentation = "https://docs.rs/qrab-qapi-macros"
readme = "README.md"
keywords = ["qemu", "qapi", "qmp", "serde", "virtualization"]
categories = ["development-tools::procedural-macro-helpers", "virtualization"]
include = ["/src/**", "/README.md", "/LICENSE", "/NOTICE"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "qapi_macros"
proc-macro = true
