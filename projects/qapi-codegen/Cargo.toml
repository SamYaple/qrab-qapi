[package]
name = "qrab-qapi-codegen"
version = "0.1.0"
description = "Generates version-annotated Rust types from QEMU QAPI schemas"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/qrab-dev/qrab-qapi"
homepage = "https://qrab.dev"
documentation = "https://docs.rs/qrab-qapi-codegen"
readme = "README.md"
keywords = ["qemu", "qapi", "qmp", "codegen", "virtualization"]
categories = ["development-tools::build-utils", "command-line-utilities", "virtualization"]
include = ["/src/**", "/qemu-versions.lock", "/KNOWN_ISSUES.md", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "qapi_codegen"
path = "src/lib.rs"

[[bin]]
name = "qapi-codegen"
path = "src/main.rs"

[dependencies]
thiserror = { workspace = true }
tempfile = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote = { workspace = true }
tar = { version = "0.4", default-features = false }
heck = "0.5.0"
nom = "8.0.0"
prettyplease = "0.3.0"
syn = { workspace = true }
