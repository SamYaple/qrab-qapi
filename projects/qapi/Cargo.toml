[package]
name = "qrab-qapi"
version = "0.1.0"
description = "QEMU QMP and guest agent (QGA) types generated from every QEMU release schema"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/qrab-dev/qrab-qapi"
homepage = "https://qrab.dev"
documentation = "https://docs.rs/qrab-qapi"
readme = "README.md"
keywords = ["qemu", "qmp", "qga", "qapi", "virtualization"]
categories = ["api-bindings", "virtualization", "emulators"]
include = ["/src/**", "/tests/**", "/build.rs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[package.metadata.docs.rs]
# docs.rs builds the default features only. Keep `schema-docs` off there:
# docs.rs cannot set QRAB_QAPI_SCHEMA_DOCS, so the feature would only compile
# the generator into the build script.
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "qapi"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
qapi-core = { workspace = true }
qapi-macros = { workspace = true }

[features]
# Opt-in local reading build. The feature only compiles the generator into
# build.rs; setting QRAB_QAPI_SCHEMA_DOCS to the absolute path of a QEMU tree
# as well regenerates the QMP/QGA types with QEMU's GPL-2.0-or-later schema
# documentation as rustdoc. Without the variable the build uses the checked-in
# generated sources, which carry no schema documentation.
schema-docs = ["dep:qapi-codegen"]

[build-dependencies]
qapi-codegen = { workspace = true, optional = true }
